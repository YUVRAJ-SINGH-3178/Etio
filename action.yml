name: Etio
description: Diagnose failed GitHub Actions jobs using repository context and Groq.
author: Yuvraj Singh
branding:
  icon: activity
  color: red

inputs:
  github-token:
    description: Token used to read workflow context and publish reports.
    required: true
  groq-api-key:
    description: Groq API key used for diagnosis. Never included in reports or prompts.
    required: true
  groq-model:
    description: Optional Groq model override. Otherwise Etio checks environment, then config.
    required: false
  diagnosis-timeout-seconds:
    description: Optional timeout for the Groq diagnosis request.
    required: false
  workflow-file:
    description: workflow_dispatch workflow used for cheap and optional real bisection.
    required: false
  real-bisect:
    description: Opt in to bounded workflow_dispatch bisection on temporary refs.
    required: false
    default: "false"
  bisect-workflow-inputs:
    description: JSON object of non-secret inputs accepted by the bisection workflow.
    required: false
    default: "{}"
  bisect-max-steps:
    description: Maximum dispatched workflow runs used to confirm a breaking commit.
    required: false
    default: "10"
  bisect-timeout-seconds:
    description: Maximum wait for each dispatched bisection workflow run.
    required: false
    default: "900"
  bisect-poll-seconds:
    description: Delay between bisection workflow status checks.
    required: false
    default: "10"
  config-path:
    description: Path to optional Etio configuration.
    required: false
    default: .github/etio.yml
  auto-pr:
    description: Open a draft pull request for a high-confidence suggested patch.
    required: false
    default: "false"
  report-mode:
    description: "Report target: auto, pull-request, commit, or none."
    required: false
    default: auto
  pr-number:
    description: Pull request number used when reporting outside a pull_request event.
    required: false
  max-diff-lines:
    description: Maximum number of diff lines eligible for LLM context.
    required: false
    default: "400"
  failed-job-id:
    description: Numeric ID of the failed workflow job when a run has multiple failures.
    required: false

outputs:
  status:
    description: Diagnosis outcome.
    value: ${{ steps.etio.outputs.status }}
  breaking-commit:
    description: Best identified breaking commit SHA.
    value: ${{ steps.etio.outputs.breaking-commit }}
  report-url:
    description: URL of the GitHub report.
    value: ${{ steps.etio.outputs.report-url }}
  diagnosis:
    description: Redacted diagnosis summary.
    value: ${{ steps.etio.outputs.diagnosis }}
  bisection-status:
    description: disabled, confirmed, incomplete, or failed.
    value: ${{ steps.etio.outputs.bisection-status }}
  auto-pr-url:
    description: URL of an Etio-generated draft pull request.
    value: ${{ steps.etio.outputs.auto-pr-url }}
  auto-pr-status:
    description: disabled, skipped, created, existing, or failed.
    value: ${{ steps.etio.outputs.auto-pr-status }}

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - shell: bash
      run: python -m pip install --disable-pip-version-check "$GITHUB_ACTION_PATH"
    - id: etio
      shell: bash
      env:
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_GROQ_API_KEY: ${{ inputs.groq-api-key }}
        INPUT_GROQ_MODEL: ${{ inputs.groq-model }}
        INPUT_DIAGNOSIS_TIMEOUT_SECONDS: ${{ inputs.diagnosis-timeout-seconds }}
        INPUT_WORKFLOW_FILE: ${{ inputs.workflow-file }}
        INPUT_REAL_BISECT: ${{ inputs.real-bisect }}
        INPUT_BISECT_WORKFLOW_INPUTS: ${{ inputs.bisect-workflow-inputs }}
        INPUT_BISECT_MAX_STEPS: ${{ inputs.bisect-max-steps }}
        INPUT_BISECT_TIMEOUT_SECONDS: ${{ inputs.bisect-timeout-seconds }}
        INPUT_BISECT_POLL_SECONDS: ${{ inputs.bisect-poll-seconds }}
        INPUT_CONFIG_PATH: ${{ inputs.config-path }}
        INPUT_AUTO_PR: ${{ inputs.auto-pr }}
        INPUT_REPORT_MODE: ${{ inputs.report-mode }}
        INPUT_PR_NUMBER: ${{ inputs.pr-number }}
        INPUT_MAX_DIFF_LINES: ${{ inputs.max-diff-lines }}
        INPUT_FAILED_JOB_ID: ${{ inputs.failed-job-id }}
      run: etio
